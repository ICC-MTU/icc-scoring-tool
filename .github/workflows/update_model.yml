name: Monthly Model Update

on:
  schedule:
    - cron: '0 8 1-7 * 1'  # First Monday of every month at 8am UTC
  workflow_dispatch:         # Also allows manual trigger from GitHub UI

jobs:
  update-model:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install pandas scikit-learn gspread google-auth numpy openpyxl

      - name: Run model update
        env:
          GOOGLE_CREDENTIALS: ${{ secrets.GOOGLE_CREDENTIALS }}
        run: python update_model.py

      - name: Commit updated model
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add model_export.json
          git diff --staged --quiet || git commit -m "Auto-update model $(date +'%Y-%m-%d')"
          git push
